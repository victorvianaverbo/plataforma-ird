[build]
  publish = "."
  command = "echo 'Building...'"

[functions]
  directory = "plataforma-ird/netlify/functions"

[[redirects]]
  from = "https://trial.institutoird.com/*"
  to = "/trial-ird/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
